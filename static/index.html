    <style>
        @import url('/static/vendor/css/fonts.css?v=2026.06.15.1781457289');

        :root {
            --accent: #000000;
            --fluid-ease: cubic-bezier(0.3, 0, 0, 1);
            --bg: #0f141d;
            --sidebar-bg: #0f141d;
            --stage-bg: #111722;
            --border: #242d3b;
            --stage-border: #2a3444;
            --text: #e5e9f0;
            --muted: #8f9aab;
            --nav-hover-bg: #171d29;
            --monitor-bg: rgba(23, 29, 41, 0.82);
            --monitor-border: rgba(255, 255, 255, 0.08);
            --monitor-shadow: rgba(0, 0, 0, 0.3);
            --divider: rgba(255, 255, 255, 0.15);
            --scrollbar: #334155;
            --scrollbar-hover: #475569;
            --author-name: #e5e9f0;
            --social-icon: #64748b;
        }

        /* 极简滚动条 */
        html,
        body {
            overscroll-behavior: auto;
            height: 100%;
            overflow: hidden;
        }

        *::-webkit-scrollbar {
            width: 10px !important;
            height: 10px !important;
            background: transparent !important;
        }

        *::-webkit-scrollbar-track {
            background: transparent !important;
            border: none !important;
        }

        *::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar) !important;
            border: 3px solid transparent !important;
            border-right-width: 3px !important;
            background-clip: padding-box !important;
            border-radius: 10px !important;
            min-height: 36px;
        }

        *::-webkit-scrollbar-thumb:hover {
            background-color: var(--scrollbar-hover) !important;
        }

        *::-webkit-scrollbar-corner {
            background: transparent !important;
        }

        * {
            scrollbar-width: thin !important;
            scrollbar-color: var(--scrollbar) transparent !important;
        }

        body {
            background: var(--bg);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            height: 100vh;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .app-shell {
            display: flex;
            width: 100%;
            height: 100vh;
            background: var(--bg);
            position: relative;
            transition: background 0.3s;
        }

        /* 主舞台区 */
        .stage {
            flex: 1;
            background: var(--stage-bg);
            margin: 16px;
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid var(--stage-border);
            position: relative;
            transition: background 0.3s, border-color 0.3s;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transform: scale(1.02);
            filter: blur(4px);
            transition: all 0.5s var(--fluid-ease);
            pointer-events: none;
        }

        iframe.active {
            opacity: 1;
            transform: scale(1);
            filter: blur(0);
            pointer-events: auto;
        }

        /* 左下角监视器 */
        .nano-monitor {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--monitor-bg);
            backdrop-filter: blur(12px);
            padding: 6px 14px;
            border-radius: 16px;
            border: 1px solid var(--monitor-border);
            box-shadow: 0 4px 20px var(--monitor-shadow);
            font-family: monospace;
            transition: all 0.4s var(--fluid-ease);
        }

        .nano-monitor.is-busy {
            background: #000;
            color: #fff;
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .stat-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text);
        }

        .nano-monitor.is-busy .stat-group {
            color: #fff;
        }

        .divider {
            width: 1px;
            height: 12px;
            background: var(--divider);
        }

        .is-busy .divider {
            background: rgba(255, 255, 255, 0.2);
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
        }

        .spinner-nano {
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .is-busy .spinner-nano { display: block; }
        .is-busy .pulse-dot { display: none; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .label-nano {
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            font-size: 9px;
        }
        .settings-fold-chevron {
            width: 13px !important;
            height: 13px !important;
            margin-left: -2px;
            opacity: 0;
            max-width: 0;
            overflow: hidden;
            transition: opacity 0.3s 0.5s, max-width 0.3s var(--fluid-ease) 0.5s, transform .22s var(--fluid-ease);
        }
        .settings-fold-toggle[aria-expanded="true"] .settings-fold-chevron {
            transform: rotate(180deg);
        }
        .settings-fold-group {
            width: 100%;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            transition: max-height .28s var(--fluid-ease), opacity .18s ease;
        }
        .settings-fold-group:not(.is-collapsed) {
            max-height: 132px;
            opacity: 1;
            pointer-events: auto;
        }

        @media (max-height: 760px) {
            .settings-fold-group {
                gap: 5px;
            }
            .settings-fold-group:not(.is-collapsed) {
                max-height: 105px;
            }
        }

        @media (max-height: 660px) {
            .settings-fold-group {
                gap: 4px;
            }
            .settings-fold-group:not(.is-collapsed) {
                max-height: 102px;
            }
        }

        .studio-modal[hidden] {
            display:none !important;
        }

        .studio-modal {
            position:fixed;
            inset:0;
            z-index:500;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            background:rgba(15,23,42,.38);
            backdrop-filter:blur(10px);
        }

        .studio-modal-panel {
            width:min(560px, 100%);
            max-height:min(760px, calc(100vh - 48px));
            display:flex;
            flex-direction:column;
            overflow:hidden;
            border-radius:8px;
            border:1px solid rgba(15,23,42,.1);
            background:#fff;
            color:#111827;
            box-shadow:0 24px 70px rgba(15,23,42,.24);
        }

        .studio-modal-head {
            display:flex;
            align-items:flex-start;
            justify-content:space-between;
            gap:16px;
            padding:20px 20px 14px;
            border-bottom:1px solid #eef2f7;
        }

        .studio-modal-kicker {
            font-size:11px;
            font-weight:900;
            letter-spacing:.08em;
            color:#16a34a;
            text-transform:uppercase;
            margin-bottom:6px;
        }

        .studio-modal-title {
            font-size:20px;
            line-height:1.25;
            font-weight:900;
            margin:0;
            letter-spacing:0;
        }

        .studio-modal-close {
            width:32px;
            height:32px;
            border-radius:8px;
            border:1px solid #e5e7eb;
            background:#fff;
            color:#64748b;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            flex:0 0 auto;
        }

        .studio-modal-close:hover {
            color:#111827;
            border-color:#cbd5e1;
            background:#f8fafc;
        }

        .studio-modal-body {
            padding:18px 20px;
            overflow:auto;
        }

        .studio-modal-copy {
            margin:0 0 14px;
            color:#475569;
            font-size:13px;
            line-height:1.7;
        }
        .studio-modal-actions {
            display:flex;
            justify-content:flex-end;
            gap:10px;
            padding:14px 20px 18px;
            border-top:1px solid #eef2f7;
            background:#fff;
        }

        .studio-modal-btn {
            min-height:36px;
            padding:0 14px;
            border-radius:8px;
            border:1px solid #e5e7eb;
            background:#fff;
            color:#334155;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:7px;
            font-size:12px;
            font-weight:900;
            cursor:pointer;
        }

        .studio-modal-btn svg {
            width:15px;
            height:15px;
            flex:0 0 auto;
        }

        .studio-modal-btn:hover {
            background:#f8fafc;
            border-color:#cbd5e1;
        }
        .studio-modal-btn.primary {
            background:#111827;
            border-color:#111827;
            color:#fff;
        }

        .studio-modal-btn.primary:hover {
            background:#16a34a;
            border-color:#16a34a;
        }

        .studio-modal-btn[disabled] {
            opacity:.58;
            cursor:wait;
        }

        html.theme-dark .studio-modal,
        body.theme-dark .studio-modal {
            background:rgba(2,6,23,.56);
        }

        html.theme-dark .studio-modal-panel,
        body.theme-dark .studio-modal-panel,
        html.theme-dark .studio-modal-close,
        body.theme-dark .studio-modal-close,
        html.theme-dark .studio-modal-actions,
        body.theme-dark .studio-modal-actions,
        html.theme-dark .studio-modal-btn,
        body.theme-dark .studio-modal-btn {
            background:#111216;
            border-color:#25262b;
            color:#e8e8ea;
        }
        html.theme-dark .studio-modal-head,
        body.theme-dark .studio-modal-head,
        html.theme-dark .studio-modal-actions,
        body.theme-dark .studio-modal-actions {
            border-color:#25262b;
        }

        html.theme-dark .studio-modal-copy,
        body.theme-dark .studio-modal-copy {
            color:#8f9aab;
        }
        html.theme-dark .studio-modal-btn.primary,
        body.theme-dark .studio-modal-btn.primary {
            background:#d8dee9;
            border-color:#d8dee9;
            color:#10141d;
        }
        html.theme-dark .studio-modal-btn.primary:hover,
        body.theme-dark .studio-modal-btn.primary:hover {
            background:#86efac;
            border-color:#86efac;
            color:#052e16;
        }

        @media (max-width: 640px) {
            .studio-modal {
                align-items:flex-end;
                padding:12px;
            }
            .studio-modal-panel {
                max-height:calc(100vh - 24px);
            }
            .studio-modal-actions {
                flex-wrap:wrap;
            }
            .studio-modal-btn {
                flex:1 1 130px;
            }
        }
        .maintenance-banner {
            position:fixed;
            top:14px;
            left:50%;
            z-index:460;
            transform:translateX(-50%);
            width:min(760px, calc(100vw - 32px));
            padding:11px 16px;
            border:1px solid rgba(245,158,11,.5);
            border-radius:12px;
            background:rgba(120,53,15,.96);
            color:#fff7ed;
            box-shadow:0 16px 42px rgba(15,23,42,.25);
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:14px;
            font-size:13px;
            font-weight:800;
        }
        #management-entry { text-decoration:none; }
        .maintenance-banner[hidden] { display:none !important; }
        #management-entry[hidden],
        .studio-modal-btn[hidden] { display:none !important; }
        .maintenance-banner.restored { background:rgba(21,128,61,.96); border-color:rgba(134,239,172,.5); }
        .maintenance-banner button { border:0; border-radius:8px; padding:6px 10px; background:rgba(255,255,255,.16); color:inherit; font-weight:900; cursor:pointer; }
        .service-disconnected {
            position:fixed;
            inset:0;
            z-index:480;
            display:grid;
            place-items:center;
            padding:24px;
            background:rgba(15,23,42,.72);
            backdrop-filter:blur(8px);
        }
        .service-disconnected[hidden] { display:none !important; }
        .service-disconnected-card { width:min(440px, 100%); padding:26px; border-radius:14px; background:var(--stage-bg); color:var(--text); border:1px solid var(--border); box-shadow:0 24px 70px rgba(0,0,0,.35); text-align:center; }
        .service-disconnected-card h2 { margin:0 0 10px; font-size:20px; }
        .service-disconnected-card p { margin:0; color:var(--muted); line-height:1.65; }
        .service-disconnected-card button { margin-top:16px; border:0; border-radius:9px; padding:9px 14px; background:#2563eb; color:#fff; font-weight:900; cursor:pointer; }
    </style>

            /* 在侧栏 DOM 解析完后立即把 active 类移到当前页对应的入口，避免首屏先在文生图上闪一下 */
            (function(){
                try {
                    var pageId = localStorage.getItem('studio_active_page');
                    if(pageId) {
                        document.querySelectorAll('.nav-item.active, .side-pill.active').forEach(function(n){
                            n.classList.remove('active');
                        });
                        var target = document.querySelector('[data-page="' + pageId + '"]');
                        if(target) target.classList.add('active');
                    }
                } catch(e) {}
            })();
        </script>

            <iframe id="frame-gpt-chat" data-src="/static/gpt-chat.html?v=2026.06.15.1781461370" scrolling="yes"></iframe>
            <iframe id="frame-canvas" data-src="/static/canvas-home.html" scrolling="yes"></iframe>
            <iframe id="frame-asset-manager" data-src="/static/asset-manager.html?v=2026.06.15.1781461370" scrolling="yes"></iframe>
            <iframe id="frame-skill-library" data-src="/static/skill-library.html" scrolling="yes" title="Skill 库"></iframe>

            <div class="nano-monitor" id="nano-monitor">
                <div class="stat-group">
                    <div class="pulse-dot animate-pulse"></div>
                    <div class="spinner-nano"></div>
                    <span class="label-nano">ONLINE</span>
                    <span id="online-val">1</span>
                </div>
            </div>
        </main>
    </div>

    <div id="maintenance-banner" class="maintenance-banner" hidden>
        <span id="maintenance-banner-text"></span>
        <button id="maintenance-refresh-btn" type="button" onclick="location.reload()" hidden>刷新页面</button>
    </div>

    <div id="service-disconnected" class="service-disconnected" hidden>
        <div class="service-disconnected-card">
            <h2 id="service-disconnected-title">服务连接中断</h2>
            <p id="service-disconnected-text">正在等待服务器恢复，页面会自动重连。</p>
            <button type="button" onclick="location.reload()">立即重试</button>
        </div>
    </div>

    <script>
        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) { }
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CID);
        const ACTIVE_PAGE_KEY = 'studio_active_page';
        const LOCAL_NAV_COLLAPSED_KEY = 'studio_local_nav_collapsed';
        const SIDEBAR_SETTINGS_COLLAPSED_KEY = 'studio_sidebar_settings_collapsed';
        const SIDEBAR_PINNED_KEY = 'studio_sidebar_pinned';
        const DEFAULT_PAGE_ID = 'canvas';
        const PAGE_IDS = ['online','gpt-chat','canvas','asset-manager','skill-library'];
        const LOCAL_PAGE_IDS = [];
        let maintenanceState = null;
        let maintenanceStatusRequest = null;
        let maintenancePollingTimer = null;

        function setSidebarPinned(pinned, options = {}) {
            const sidebar = document.getElementById('studioSidebar');
            const logo = document.getElementById('sidebarLogoToggle');
            if(!sidebar) return;
            sidebar.classList.toggle('is-pinned', pinned);

            if(logo) {
                logo.setAttribute('aria-pressed', pinned ? 'true' : 'false');
                logo.setAttribute('aria-expanded', pinned ? 'true' : 'false');
                logo.title = pinned ? '收起导航栏' : '展开导航栏';
                logo.setAttribute('aria-label', logo.title);
            }
            if(!options.skipRemember) localStorage.setItem(SIDEBAR_PINNED_KEY, pinned ? '1' : '0');
        }

        function toggleSidebarPinned(event) {
            event?.preventDefault?.();
            event?.stopPropagation?.();
            const sidebar = document.getElementById('studioSidebar');
            const expanding = !sidebar?.classList.contains('is-pinned');
            setSidebarPinned(expanding);
            const logo = document.getElementById('sidebarLogoToggle');
            if(logo && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                logo.classList.remove('logo-opening', 'logo-closing');
                void logo.offsetWidth; // Restart the feedback on each deliberate click.
                logo.classList.add(expanding ? 'logo-opening' : 'logo-closing');
            }
        }

        function restoreSidebarPinned() {
            setSidebarPinned(localStorage.getItem(SIDEBAR_PINNED_KEY) === '1', { skipRemember:true });
        }

        function setLocalNavCollapsed(collapsed, options = {}) {
            const group = document.getElementById('local-nav-group');
            const toggle = document.getElementById('local-nav-toggle');
            if(group) group.classList.toggle('is-collapsed', collapsed);
            if(toggle) {
                toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                toggle.title = collapsed ? '展开本地功能' : '折叠本地功能';
            }
            if(!options.skipRemember) localStorage.setItem(LOCAL_NAV_COLLAPSED_KEY, collapsed ? '1' : '0');
        }

        function toggleLocalNav() {
            const group = document.getElementById('local-nav-group');
            setLocalNavCollapsed(!group?.classList.contains('is-collapsed'));
        }

        function restoreLocalNav(id) {
            const savedCollapsed = localStorage.getItem(LOCAL_NAV_COLLAPSED_KEY) === '1';
            setLocalNavCollapsed(savedCollapsed && !LOCAL_PAGE_IDS.includes(id), { skipRemember:true });
        }

        function setSidebarSettingsCollapsed(collapsed, options = {}) {
            const group = document.getElementById('settings-fold-group');
            const toggle = document.getElementById('settings-fold-toggle');
            if(group) group.classList.toggle('is-collapsed', collapsed);
            if(toggle) {
                toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                toggle.title = collapsed ? '展开更多设置' : '收起更多设置';
            }
            if(!options.skipRemember) localStorage.setItem(SIDEBAR_SETTINGS_COLLAPSED_KEY, collapsed ? '1' : '0');
        }

        function toggleSidebarSettings() {
            const group = document.getElementById('settings-fold-group');
            setSidebarSettingsCollapsed(!group?.classList.contains('is-collapsed'));
        }

        function restoreSidebarSettings(id) {
            const savedCollapsed = localStorage.getItem(SIDEBAR_SETTINGS_COLLAPSED_KEY) !== '0';
            setSidebarSettingsCollapsed(savedCollapsed, { skipRemember:true });
        }

        function resetStudioRootScroll() {
            try {
                window.scrollTo(0, 0);
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;
            } catch(e) {}
        }

        function switchUI(el, id, options = {}) {
            resetStudioRootScroll();
            if(!PAGE_IDS.includes(id)) id = DEFAULT_PAGE_ID;
            document.querySelectorAll('.nav-item,.side-pill').forEach(n => n.classList.remove('active'));
            if(el) el.classList.add('active');
            document.querySelectorAll('[data-page]').forEach(n => {
                if(n.dataset.page === id) n.setAttribute('aria-current','page');
                else n.removeAttribute('aria-current');
            });
            window.StudioShell?.closeMobile();
            document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
            const target = document.getElementById('frame-' + id);
            target.classList.add('active');
            if(id==='canvas' && !target.src && new URLSearchParams(location.search).get('create')==='classic'){
                target.dataset.src += (target.dataset.src.includes('?')?'&':'?')+'create=classic';
                const clean=new URL(location.href);clean.searchParams.delete('create');history.replaceState(history.state,'',clean);
            }
            if (!target.src) target.src = window.CanvasSession ? window.CanvasSession.url(target.dataset.src) : target.dataset.src;
            if(!options.skipRemember) localStorage.setItem(ACTIVE_PAGE_KEY, id);
            syncLanguageToFrame(target);
            if(LOCAL_PAGE_IDS.includes(id)) {
                setLocalNavCollapsed(false, { skipRemember:true });
            } else {
                setLocalNavCollapsed(localStorage.getItem(LOCAL_NAV_COLLAPSED_KEY) === '1', { skipRemember:true });
            }
            // 切换到画布时通知刷新工作流列表（防止在 comfyui-settings 修改后画布未及时更新）
            if (id === 'canvas' && target.src) {
                window.StudioFrameMessages.send(target, { type: 'canvas-focus' });
            }
            resetStudioRootScroll();
        }

        function forwardStudioApiChange(data) {
            if(!data || !['providers-changed','workflows-changed','comfy-instances-changed'].includes(data.type)) return;
            window.StudioFrameMessages.broadcast(data);
        }

        window.StudioFrameMessages.subscribe(['providers-changed','workflows-changed','comfy-instances-changed'], event => forwardStudioApiChange(event.data));
        window.StudioFrameMessages.subscribeApi(event => forwardStudioApiChange(event.data));

        async function restoreActivePage() {
            if (window.CanvasSession) await window.CanvasSession.ready;
            restoreSidebarPinned();
            const savedId = localStorage.getItem(ACTIVE_PAGE_KEY);
            const id = /^\/workspaces\/[^/]+$/.test(location.pathname) ? 'canvas' : PAGE_IDS.includes(savedId) && !LOCAL_PAGE_IDS.includes(savedId) ? savedId : DEFAULT_PAGE_ID;
            restoreLocalNav(id);
            restoreSidebarSettings(id);
            const trigger = document.querySelector(`[onclick*="'${id}'"],[onclick*='"${id}"']`);
            switchUI(trigger, id, { skipRemember:true });
            document.documentElement.classList.remove('studio-route-booting');
        }
        document.addEventListener('DOMContentLoaded', restoreActivePage, { once:true });

        const host = window.location.host;
        const studioStatsConnection = window.StudioStatsConnection.create({
            window,
            ready: () => window.CanvasSession?.ready,
            address: () => {
                if(!host) return null;
                const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
                const address = `${protocol}://${host}/ws/stats?client_id=${encodeURIComponent(CID)}`;
                return window.CanvasSession ? window.CanvasSession.socketUrl(address) : address;
            },
            onOpen: handleStudioConnected,
            onMessage: handleStudioSocketMessage,
            onUnavailable: showServiceDisconnected,
        });
        if (host) {
            connectStudioWebSocket();
            setInterval(() => {
                if(maintenanceState?.mode !== 'draining') fetchMaintenanceStatus();
            }, 60000);
        }

        function toggleLanguage() {
            document.querySelectorAll('iframe').forEach(frame => syncLanguageToFrame(frame));
        }

        function syncLanguageToFrame(frame) {
            window.StudioFrameMessages.send(frame, { type:'studio-lang', lang:'zh' });
        }

        function broadcastLanguage() {
            window.StudioFrameMessages.broadcast({ type:'studio-lang', lang:'zh' });
        }

        window.addEventListener('DOMContentLoaded', () => {
            broadcastLanguage();
            fetchMaintenanceStatus();
        });

        window.StudioFrameMessages.watchFrameLoads(frame => {
            syncLanguageToFrame(frame);
        });

        function maintenanceCountdown(snapshot = {}) {
            const plannedAt = Number(snapshot.planned_at || 0);
            if(!plannedAt) return '';
            const remaining = plannedAt - Date.now();
            if(remaining <= 0) return '预计停服时间已到';
            return `预计约 ${Math.max(1, Math.ceil(remaining / 60000))} 分钟后停服`;
        }

        function forwardMaintenanceToFrames(snapshot) {
            window.StudioFrameMessages.broadcast({type:'maintenance_changed', data:snapshot});
        }

        function showTransientBanner(text, refresh = false) {
            const banner = document.getElementById('maintenance-banner');
            const label = document.getElementById('maintenance-banner-text');
            const refreshBtn = document.getElementById('maintenance-refresh-btn');
            if(!banner || !label) return;
            banner.classList.add('restored');
            label.textContent = text;
            banner.hidden = false;
            if(refreshBtn) refreshBtn.hidden = !refresh;
            if(!refresh) window.setTimeout(() => {
                if(maintenanceState?.mode !== 'draining') banner.hidden = true;
            }, 8000);
        }

        function renderMaintenanceSnapshot(snapshot = maintenanceState || {}) {
            const draining = snapshot.mode === 'draining';
            const banner = document.getElementById('maintenance-banner');
            const bannerText = document.getElementById('maintenance-banner-text');
            const refreshBtn = document.getElementById('maintenance-refresh-btn');
            if(banner && bannerText) {
                if(draining) {
                    banner.classList.remove('restored');
                    bannerText.textContent = [
                        snapshot.message || '服务器正在准备维护，请保存当前工作。',
                        maintenanceCountdown(snapshot),
                        `当前仍有 ${snapshot.active || 0} 个生成任务`,
                    ].filter(Boolean).join(' · ');
                    banner.hidden = false;
                    if(refreshBtn) refreshBtn.hidden = true;
                } else if(!banner.classList.contains('restored')) {
                    banner.hidden = true;
                }
            }
        }

        function handleMaintenanceSnapshot(snapshot = {}) {
            if(!snapshot || typeof snapshot !== 'object') return;
            const previousMode = maintenanceState?.mode || '';
            const previousBoot = localStorage.getItem('studio_server_boot_id') || '';
            const nextBoot = String(snapshot.boot_id || '');
            maintenanceState = snapshot;
            if(snapshot.mode === 'draining') {
                localStorage.setItem('studio_maintenance_last', JSON.stringify({
                    mode:'draining', message:snapshot.message || '', planned_at:Number(snapshot.planned_at || 0),
                }));
            } else {
                localStorage.removeItem('studio_maintenance_last');
            }
            if(nextBoot) {
                localStorage.setItem('studio_server_boot_id', nextBoot);
                if(previousBoot && previousBoot !== nextBoot) {
                    showTransientBanner('服务已重新启动，可以继续使用。');
                    window.FrontendVersion?.checkForUpdate?.();
                } else if(previousMode === 'draining') {
                    showTransientBanner('服务已恢复，可以继续使用。');
                }
            }
            syncMaintenancePolling(snapshot.mode === 'draining');
            renderMaintenanceSnapshot(snapshot);
            forwardMaintenanceToFrames(snapshot);
        }

        function syncMaintenancePolling(draining) {
            if(draining && !maintenancePollingTimer) {
                maintenancePollingTimer = window.setInterval(
                    () => fetchMaintenanceStatus(),
                    2500,
                );
            } else if(!draining && maintenancePollingTimer) {
                window.clearInterval(maintenancePollingTimer);
                maintenancePollingTimer = null;
            }
        }

        function fetchMaintenanceStatus() {
            if(maintenanceStatusRequest) return maintenanceStatusRequest;
            maintenanceStatusRequest = (async () => {
                try {
                    const response = await fetch('/api/maintenance/status', {cache:'no-store'});
                    if(!response.ok) throw new Error(`HTTP ${response.status}`);
                    const snapshot = await response.json();
                    hideServiceDisconnected();
                    if(window.CanvasSession) window.CanvasSession.observeStatus(snapshot);
                    else handleMaintenanceSnapshot(snapshot);
                    return snapshot;
                } catch(error) {
                    if(!studioStatsConnection.isOpen()) showServiceDisconnected();
                    return null;
                } finally {
                    maintenanceStatusRequest = null;
                }
            })();
            return maintenanceStatusRequest;
        }

        function showServiceDisconnected() {
            const overlay = document.getElementById('service-disconnected');
            if(!overlay) return;
            let remembered = maintenanceState;
            if(!remembered) {
                try { remembered = JSON.parse(localStorage.getItem('studio_maintenance_last') || 'null'); } catch(e) {}
            }
            const planned = remembered?.mode === 'draining';
            document.getElementById('service-disconnected-title').textContent = planned ? '服务正在维护' : '服务连接中断';
            document.getElementById('service-disconnected-text').textContent = planned
                ? '管理员正在手动更新服务。现有视频任务已保留，服务恢复后页面会自动重新连接。'
                : '暂时无法连接服务器，正在自动重试。请不要关闭包含未保存内容的页面。';
            overlay.hidden = false;
        }

        function hideServiceDisconnected() {
            const overlay = document.getElementById('service-disconnected');
            if(overlay) overlay.hidden = true;
        }

        function updateStudioOnlineCount(data) {
            document.getElementById('online-val').innerText = data.online_members ?? data.online_count ?? 0;
        }

        function handleStudioConnected(reconnected) {
            hideServiceDisconnected();
            if(reconnected || !maintenanceState) fetchMaintenanceStatus();
        }

        function handleStudioSocketMessage(data) {
            if(data.type === 'stats') {
                updateStudioOnlineCount(data);
                if(window.CanvasSession) window.CanvasSession.observeStatus(data);
            } else if(data.type === 'maintenance_changed') {
                handleMaintenanceSnapshot(data.data || {});
            } else {
                window.StudioFrameMessages.forwardUpdate(data);
            }
        }

        function connectStudioWebSocket() {
            return studioStatsConnection.start();
        }

    </script>
    <script src="/static/js/studio-shell.js"></script>
    <script src="/static/js/management-entry.js"></script>
    <script src="/static/js/frontend-version.js"></script>
</body>

</html>
