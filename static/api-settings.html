<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 设置</title>
  <script>
    (function(){
      try {
        var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
        if(theme === 'dark') {
          document.documentElement.classList.add('studio-theme-dark');
          document.documentElement.classList.add('theme-dark');
        }
      } catch(e) {}
    })();
  </script>

  <script src="/static/vendor/js/lucide.js?v=2026.06.10.1.1781494198"></script>
  <script src="/static/js/theme.js?v=2026.06.10.1.1781494198"></script>
  <link rel="stylesheet" href="/static/css/theme.css?v=2026.06.10.1.1781494198">

</head>
<body>

</body>
</html>
