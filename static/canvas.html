<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/images/logo.png" type="image/png">
  <title>无限画布</title>
  <script data-theme-preload>
    (() => {
      try {
        const theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
        if (theme === 'dark') document.documentElement.classList.add('studio-theme-dark', 'theme-dark');
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/dist/canvas-modern.css?v=2026.08.20.1">
  <link rel="stylesheet" href="/static/dist/theme-style.css?v=2026.08.20.1">
</head>
<body>
  <div id="canvasModernApp"></div>
  <script type="module" src="/static/dist/canvas-modern.js?v=2026.08.19.35"></script>
</body>
</html>
