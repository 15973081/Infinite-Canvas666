<!DOCTYPE html>
<html class="studio-theme-dark theme-dark" lang="zh-CN" data-studio-scale="off">
<head>
<meta name="color-scheme" content="dark">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/shadox-mark.svg?v=1" type="image/svg+xml">
    <title>素材库管理</title>
    <script src="/static/vendor/js/tabler-icons.js"></script>
    <script src="/static/js/studio-icons.js"></script>
    <script src="/static/js/studio-frame-messages.js"></script>
    <script src="/static/js/studio-display.js?v=2026.10.14.1"></script>

    <link rel="stylesheet" href="/static/css/asset-manager.css?v=2026.09.07.2">
<link rel="stylesheet" href="/static/css/studio-workbench.css">
    <link rel="stylesheet" href="/static/css/studio-library.css">
</head>
<body class="studio-skin studio-content studio-library">
    <div class="asset-page">
        <header class="asset-page-head">
            <div>
                <div class="asset-title">素材库管理</div>
                <div class="asset-sub">按库、分组、内容和预览管理素材与工作流。</div>
            </div>
            <div class="asset-head-actions">
                <div id="assetStatus" class="asset-status">准备就绪</div>
                <button id="refreshBtn" class="asset-btn" type="button"><i data-lucide="refresh-cw"></i><span>刷新</span></button>
            </div>
        </header>

        <div class="asset-tabs">
            <button id="assetTabAssets" class="active" type="button" data-tab="assets"><i data-lucide="image"></i><span>图片资产</span></button>
            <button id="assetTabWorkflows" type="button" data-tab="workflows"><i data-lucide="workflow"></i><span>工作流管理</span></button>
            <button id="assetTabCanvasAssets" type="button" data-tab="canvas-assets"><i data-lucide="layout-dashboard"></i><span>画布资产</span></button>
        </div>

        <main id="assetManagerRoot" class="asset-manager-root"></main>
    </div>

    <input id="assetUploadInput" type="file" accept="image/*,video/*,audio/*,.json,.zip,application/json,application/zip" multiple hidden>
    <link rel="stylesheet" href="/static/css/studio-transfer-status.css">
    <script src="/static/js/studio-transfer-status.js"></script>
    <script src="/static/js/asset-manager.js?v=2026.09.18.2"></script>
</body>
</html>
