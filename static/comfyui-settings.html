<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ComfyUI 工作流设置</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
        if (theme === 'dark') document.documentElement.classList.add('studio-theme-dark', 'theme-dark');
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/css/comfyui-settings.css?v=2026.08.19.1">
  <link rel="stylesheet" href="/static/css/theme.css?v=2026.06.9.1779672341">
</head>
<body>
  <div id="comfySettingsApp"></div>
  <script type="module" src="/static/dist/comfyui-settings-modern.js?v=2026.08.19.1"></script>
</body>
</html>
