<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>登录 · 无限画布</title>
<link rel="stylesheet" href="/static/css/login.css?v=20260916-mask">
<script src="/static/js/login.js" defer></script>
</head>
<body>
<main class="login-shell">
<div class="welcome-icon" aria-hidden="true"><svg viewBox="0 0 240 120" fill="none"><defs><linearGradient id="infinity-metal" x1="35" y1="10" x2="195" y2="110" gradientUnits="userSpaceOnUse"><stop stop-color="#111318"/><stop offset=".35" stop-color="#525965"/><stop offset=".52" stop-color="#b4bbc5"/><stop offset=".68" stop-color="#272b32"/><stop offset="1" stop-color="#08090b"/></linearGradient></defs><path d="M120 60C95 20 81 22 62 22C13 22 13 98 62 98C85 98 99 90 120 60C145 20 159 22 178 22C227 22 227 98 178 98C155 98 141 90 120 60Z" stroke="url(#infinity-metal)" stroke-width="18" stroke-linecap="round"/></svg></div>
<header class="auth-brand"><a href="/login"><span aria-hidden="true">∞</span> 无限画布</a><span class="auth-brand-caption">创作，不设边界。</span></header>
<section class="form-panel">

<div class="form-content">


<h2 id="form-title">进入无限画布</h2>
<p class="subtitle" id="form-subtitle">登录工作区，继续未完成的灵感。</p>
<form id="login-form">
<div id="activation-wrap" hidden><label for="activation-token">一次性激活凭证</label><div class="input-wrap"><input id="activation-token" type="password" autocomplete="off" maxlength="256" placeholder="粘贴管理员提供的凭证"></div></div>
<label id="username-label" for="username">访问账号</label>
<div class="input-wrap"><input id="username" name="username" autocomplete="username" maxlength="64" placeholder="输入你的访问账号" required disabled></div>
<div class="password-label"><label for="password">密码</label><button class="text-button" id="help-button" type="button">忘记密码？</button></div>
<div class="input-wrap"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" placeholder="输入密码" required disabled><button id="toggle-password" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div>
<div id="confirm-wrap" hidden><label for="confirm-password">确认密码</label><div class="input-wrap"><input id="confirm-password" type="password" autocomplete="new-password" maxlength="256" placeholder="再次输入密码"></div></div>
<label class="remember"><input id="remember" type="checkbox"><span>保持登录 30 天</span></label>
<div class="message-slot"><div class="message" id="form-message" role="alert" aria-atomic="true" hidden></div></div>
<button class="submit-button" id="submit-button" type="submit" disabled><span id="submit-label">正在连接工作区…</span></button>
</form>
<button id="activation-button" class="text-button" type="button" hidden>首次使用或重置密码？激活账号</button>
<div id="help-message" class="help-message" role="status" hidden>请联系工作区管理员重置访问密码。本地管理员可按项目登录说明恢复账号。</div>
<div class="workspace-note"><span aria-hidden="true">◇</span><p>一个入口，连接所有创作。<small id="workspace-note-text">使用工作区访问账号登录，画布与素材保留在原工作区。</small></p></div>
<button id="retry-button" type="button" class="text-button" hidden>重新连接</button>
</div>
<footer class="panel-footer">无限画布 · 文字、图像与视频的创作空间</footer>
</section>
</main>
<script type="module" src="/static/js/infinity-hero.js?v=20260916-mask"></script>
</body>
</html>
