<!doctype html>
<html class="studio-theme-dark theme-dark" lang="zh-CN">
<head>
<meta name="color-scheme" content="dark">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="canvas-page-role" content="directory">
<title>画布首页 · shadox</title>
<script src="/static/js/canvas-navigation.js"></script>
<script src="/static/vendor/js/tabler-icons.js"></script>
<script src="/static/js/studio-icons.js"></script>
<script src="/static/js/studio-frame-messages.js"></script>
<script src="/static/js/studio-display.js?v=2026.10.14.1"></script>
<link rel="stylesheet" href="/static/css/canvas-home-base.css">
<link rel="stylesheet" href="/static/css/studio-workbench.css">
<link rel="stylesheet" href="/static/css/utilities.css">
<link rel="stylesheet" href="/static/css/canvas-name-dialog.css">
<link rel="stylesheet" href="/static/css/canvas-home.css">
<link rel="stylesheet" href="/static/css/canvas-cover.css">
<link rel="stylesheet" href="/static/css/studio-project-home.css">
<link rel="stylesheet" href="/static/css/canvas-folder-cards.css">
</head>
<body class="studio-skin studio-canvas-home">
<section class="studio-desktop-required" aria-labelledby="desktopRequiredTitle"><div><h2 id="desktopRequiredTitle">请使用桌面端访问</h2><p>编辑与创作功能需在较宽屏幕下使用。请将浏览器窗口拉大，或改用电脑访问以获得完整体验。</p></div></section>
<main id="shell" class="shell">
        <div id="canvasGate" class="canvas-gate gate-loading" aria-busy="true">
          <div class="gate-panel">
            <nav id="projectFolderPath" class="project-folder-path" aria-label="文件夹路径" hidden></nav>
            <div class="gate-head"><div class="gate-head-text"><button id="gateBackBtn" class="gate-back-link" type="button"><i data-lucide="arrow-left"></i>返回画布列表</button><div class="gate-title-row"><h1 id="gateTitleText" class="gate-title">全部画布</h1><span id="gateCountPill" class="gate-count-pill">0 个</span></div><div id="gateSubtitle" class="gate-subtitle"></div></div></div>
            <div class="studio-library-tools"><div id="gateSearch" class="gate-search" role="search">
                            <i data-lucide="search" class="w-4 h-4" aria-hidden="true"></i>
                            <input id="gateSearchInput" type="search" autocomplete="off" spellcheck="false" placeholder="搜索画布名称" aria-label="搜索画布名称">
                            <button id="gateSearchClear" class="gate-search-clear" type="button" title="清空搜索" aria-label="清空搜索">
                                <i data-lucide="x" class="w-3.5 h-3.5" aria-hidden="true"></i>
                            </button>
                        </div>
              <div class="studio-pick"><button class="studio-pick-trigger" id="studioFolderTrigger" type="button" aria-expanded="false" aria-controls="studioFolderMenu"><span id="studioFolderLabel">全部文件夹</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div id="studioFolderMenu" class="studio-pick-menu" hidden><aside class="gate-folder-pane" aria-label="画布文件夹">
                        <div class="gate-folder-head">
                            <span>文件夹</span>
                            <button id="gateNewFolderBtn" class="gate-folder-add" type="button" title="新建文件夹" aria-label="新建文件夹"><i data-lucide="folder-plus" class="w-3.5 h-3.5"></i></button>
                        </div>
                        <div id="gateFolderTree" class="gate-folder-tree"></div>
                    </aside></div></div>
              <div class="studio-pick"><button class="studio-pick-trigger" id="studioSortTrigger" type="button" aria-expanded="false" aria-controls="studioSortMenu"><span id="studioSortLabel">最近编辑</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div id="studioSortMenu" class="studio-pick-menu studio-sort-menu" hidden><div id="gateSortSwitch" class="gate-sort" role="group" aria-label="排序方式"><button type="button" class="gate-sort-btn active" data-sort="recent">最近编辑</button><button type="button" class="gate-sort-btn" data-sort="name">名称</button></div></div></div>
              <span class="project-tools-spacer" aria-hidden="true"></span>
              <button id="gateRefreshBtn" class="gate-icon-btn" type="button" title="刷新列表" aria-label="刷新列表"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button><button id="gateTrashBtn" class="gate-icon-btn gate-trash-entry" type="button" title="打开回收站" aria-label="打开回收站"><i data-lucide="trash-2" class="w-4 h-4"></i><span id="gateTrashCount" class="gate-trash-badge">0</span></button><button id="gateAssetManagerBtn" type="button" hidden>素材库管理</button>
              <button id="gateCreateFolderBtn" class="gate-icon-btn project-create-folder" type="button"><i data-lucide="folder-plus" class="w-4 h-4"></i><span>新建文件夹</span></button>
              <button id="gateCreateBtn" class="gate-icon-btn project-create-button" type="button"><i data-lucide="plus" class="w-4 h-4"></i><span>新建画布</span></button>
            </div>
            <div id="gateStatus" class="gate-status" role="status" aria-live="polite">正在加载画布列表…</div><div id="studioHomeFeedback" role="status" aria-live="polite" hidden></div><div class="trash-note">回收站中的画布会在 30 天后自动清理。</div>
            <div class="gate-browser"><div class="gate-canvas-pane"><div id="gateFolderBar" class="gate-folder-bar"></div><div id="gateCanvasList" class="gate-list"></div></div></div>
          </div>
        </div>


</main>
<script src="/static/js/canvas-directory-model.js"></script>
<script src="/static/js/canvas-directory-api.js"></script>
<script src="/static/js/canvas-folder-deletion.js"></script>
<script src="/static/js/canvas-name-dialog.js"></script>
<script src="/static/js/canvas-media-loader.js"></script>
<script src="/static/js/canvas-cover-preview.js"></script>
<script src="/static/js/canvas-folder-cards.js"></script>
<script src="/static/js/canvas-home.js"></script>
</body></html>
