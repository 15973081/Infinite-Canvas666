<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/shadox-mark.svg?v=1" type="image/svg+xml">
    <title>GPT 对话</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/tabler-icons.js"></script>
    <script src="/static/js/studio-icons.js"></script>
    <script src="/static/js/studio-frame-messages.js"></script>
    <script src="/static/js/theme.js?v=2026.06.9.1780456238"></script>

    <link rel="stylesheet" href="/static/css/chat.css">
<link rel="stylesheet" href="/static/css/studio-workbench.css">
    <link rel="stylesheet" href="/static/css/utilities.css">
    <link rel="stylesheet" href="/static/css/studio-chat.css">
</head>
<body class="studio-skin studio-content studio-chat">
    <div class="chat-shell">
        <main class="chat-main">
            <header class="topbar">
                <div class="topbar-inner">
                    <div class="title-block">
                        <h1 id="chatTitle">新对话</h1>
                    </div>
                    <div class="top-actions">
                        <button onclick="event.stopPropagation();newConversation()" class="action-btn" title="新对话"><i data-lucide="plus"></i><span>新建</span></button>
                        <button onclick="event.stopPropagation();toggleHistory()" class="action-btn history-toggle" title="历史"><i data-lucide="history"></i><span>历史</span></button>
                        <aside id="historyPopover" class="chat-rail">
                            <div class="rail-head">
                                <div>
                                    <div class="rail-kicker">对话列表</div>
                                    <div class="rail-title">历史</div>
                                </div>
                                <button onclick="event.stopPropagation();toggleHistory(false)" class="rail-close" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button>
                            </div>
                            <button onclick="event.stopPropagation();newConversation()" class="rail-new" title="新对话"><i data-lucide="plus"></i><span>新建</span></button>
                            <div id="threadList" class="thread-list"></div>
                        </aside>
                    </div>
                </div>
            </header>

            <section id="messages" class="messages"></section>

            <div class="composer-wrap">
                <div class="composer">
                    <div id="composerBody" class="composer-body">
                        <textarea id="messageInput" rows="4" placeholder="输入消息，Enter 发送..." oninput="autoGrow(this)" onkeydown="handleKey(event)"></textarea>
                        <div id="refStrip" class="ref-strip"></div>
                        <div class="composer-inside-foot">
                            <div class="left-tools">
                                <div class="inline-controls">
                                    <input id="attachmentInput" class="file-input" type="file" multiple onchange="uploadFiles(this.files); this.value='';">
                                    <button type="button" class="upload-btn" onclick="document.getElementById('attachmentInput')?.click()" title="上传附件" aria-label="上传附件">
                                        <i data-lucide="paperclip"></i>
                                    </button>
                                    <div id="modelPicker" class="model-picker">
                                        <button id="modelPickerBtn" class="model-picker-button" onclick="event.stopPropagation();toggleModelPicker()" title="选择平台和模型">
                                            <i data-lucide="boxes"></i>
                                            <span class="model-picker-labels">
                                                <span id="modelPickerProvider" class="model-picker-provider">API</span>
                                                <span class="model-picker-dot"></span>
                                                <span id="modelPickerModel" class="model-picker-model">Model</span>
                                            </span>
                                            <i data-lucide="chevron-up"></i>
                                        </button>
                                        <div id="modelPickerPopover" class="model-picker-popover" onclick="event.stopPropagation()">
                                            <div class="model-picker-head">
                                                <div id="modelPickerTitle" class="model-picker-title">模型选择</div>
                                                <div id="modelPickerScope" class="model-picker-scope"></div>
                                            </div>
                                            <div class="model-picker-body">
                                                <div id="modelProviderList" class="model-picker-list"></div>
                                                <div id="modelList" class="model-picker-list"></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div id="imageControls" class="image-controls hidden">
                                        <div class="mini-ratio">
                                            <button id="chat-ratio-square" class="active" onclick="setChatRatio('square')"><i data-lucide="square" class="w-3 h-3"></i>1:1</button>
                                            <button id="chat-ratio-portrait" onclick="setChatRatio('portrait')"><i data-lucide="rectangle-vertical" class="w-3 h-3"></i>2:3</button>
                                            <button id="chat-ratio-landscape" onclick="setChatRatio('landscape')"><i data-lucide="rectangle-horizontal" class="w-3 h-3"></i>3:2</button>
                                            <button id="chat-ratio-portrait43" onclick="setChatRatio('portrait43')"><i data-lucide="rectangle-vertical" class="w-3 h-3"></i>3:4</button>
                                            <button id="chat-ratio-landscape43" onclick="setChatRatio('landscape43')"><i data-lucide="rectangle-horizontal" class="w-3 h-3"></i>4:3</button>
                                            <button id="chat-ratio-story" onclick="setChatRatio('story')"><i data-lucide="smartphone" class="w-3 h-3"></i>9:16</button>
                                            <button id="chat-ratio-wide" onclick="setChatRatio('wide')"><i data-lucide="monitor" class="w-3 h-3"></i>16:9</button>
                                        </div>
                                        <div class="resolution-toggle" title="分辨率">
                                            <button id="chat-res-1k" class="resolution-option active" onclick="setChatResolution('1k')">1K</button>
                                            <button id="chat-res-2k" class="resolution-option" onclick="setChatResolution('2k')">2K</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button id="sendBtn" onclick="sendMessage()" class="send-btn" title="发送"><i data-lucide="send"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="imagePreviewModal" class="image-preview-modal" onclick="closeImagePreview()">
        <button class="image-preview-close" title="关闭" aria-label="关闭" onclick="event.stopPropagation();closeImagePreview()"><i data-lucide="x"></i></button>
        <img id="imagePreviewImg" src="" alt="preview" onclick="event.stopPropagation()">
    </div>

    <script>
        lucide.createIcons();
        const PAGE_I18N = {
            'chat.agentWorking': '正在判断并调用合适的工具...',
            'chat.deleteConfirm': '删除这条历史对话？',
            'chat.deleteTitle': '删除对话',
            'chat.generated': '生成完成',
            'chat.generatingImage': '正在生成图片...',
            'chat.newConversation': '新对话',
            'chat.noHistory': '暂无历史',
            'chat.ready': '就绪',
            'chat.requestFailed': '请求失败',
            'chat.title': 'GPT 对话'
        };
        function tr(key){ return PAGE_I18N[key] || key; }
        function defaultTitle(){ return tr('chat.newConversation'); }
        function setChatTitle(title){
            document.getElementById('chatTitle').textContent = title || defaultTitle();
        }
        function applyLanguage(){
            document.title = tr('chat.title');
            if(!currentConversation?.title || currentConversation.title === '新对话' || currentConversation.title === 'New Chat') setChatTitle('');
            renderThreads();
        }
        window.StudioFrameMessages.subscribe(['studio-lang'], event => {
            if(event.data?.type === 'studio-lang') applyLanguage();
        });
        window.addEventListener('studio-lang-change', () => {
            document.title = tr('chat.title');
            if(!currentConversation?.title || currentConversation.title === '新对话' || currentConversation.title === 'New Chat') setChatTitle('');
            renderThreads();
        });
        window.addEventListener('resize', () => {
            if(document.getElementById('modelPicker')?.classList.contains('open')) positionModelPicker();
        });
        window.addEventListener('scroll', positionModelPicker, true);
        document.addEventListener('keydown', event => {
            if(event.key === 'Escape' && document.getElementById('modelPickerPopover')?.classList.contains('open')) {
                toggleModelPicker(false);
                document.getElementById('modelPickerBtn')?.focus();
            }
        });
        function uuid(){
            if(crypto?.randomUUID) return crypto.randomUUID();
            return 'u-' + Math.random().toString(16).slice(2) + Date.now();
        }

        const USER_KEY = 'gpt_chat_browser_user';
        const CHAT_SETTINGS_KEY = 'gpt_chat_settings_v1';
        const CHAT_LAST_CONVERSATION_KEY = 'gpt_chat_last_conversation_v1';
        const userId = localStorage.getItem(USER_KEY) || uuid();
        localStorage.setItem(USER_KEY, userId);

        function readChatSettings(){
            try {
                const raw = localStorage.getItem(CHAT_SETTINGS_KEY);
                const parsed = raw ? JSON.parse(raw) : {};
                return parsed && typeof parsed === 'object' ? parsed : {};
            } catch(e) {
                return {};
            }
        }

        function isObject(value){
            return value && typeof value === 'object' && !Array.isArray(value);
        }

        const savedChatSettings = readChatSettings();
        let conversations = [];
        let currentConversation = null;
        let mode = 'chat';
        let provider = savedChatSettings.provider || 'comfly';
        let activeChatModel = savedChatSettings.activeChatModel || '';
        let activeImageProvider = savedChatSettings.activeImageProvider || 'comfly';
        let activeImageModel = savedChatSettings.activeImageModel || '';
        let apiProviders = [];
        let chatProviderModels = isObject(savedChatSettings.chatProviderModels) ? savedChatSettings.chatProviderModels : {};
        let chatRatio = ['square','portrait','portrait43','landscape43','landscape','story','wide'].includes(savedChatSettings.chatRatio) ? savedChatSettings.chatRatio : 'square';
        let chatResolution = ['1k','2k'].includes(savedChatSettings.chatResolution) ? savedChatSettings.chatResolution : '1k';
        let modelPickerScope = savedChatSettings.modelPickerScope === 'image' ? 'image' : 'chat';
        let modelPickerHome = null;
        let refs = [];
        let config = { chat_model: 'gpt-5.5', image_model: 'gpt-image-2' };

        const SIZE_OPTIONS = {
            square: [['1024x1024','1k'], ['1536x1536','2k']],
            portrait: [['720x1080','1k'], ['1024x1536','2k']],
            portrait43: [['1008x1344','1k'], ['1536x2048','2k']],
            landscape43: [['1344x1008','1k'], ['2048x1536','2k']],
            landscape: [['1080x720','1k'], ['1536x1024','2k']],
            story: [['720x1280','1k'], ['1080x1920','2k']],
            wide: [['1280x720','1k'], ['1920x1080','2k']]
        };

        const headers = () => ({'Content-Type':'application/json', 'X-User-ID':userId});

        function rememberConversation(id){
            try {
                if(id) localStorage.setItem(CHAT_LAST_CONVERSATION_KEY, id);
                else localStorage.removeItem(CHAT_LAST_CONVERSATION_KEY);
            } catch(e) {}
        }

        function rememberedConversation(){
            try { return localStorage.getItem(CHAT_LAST_CONVERSATION_KEY) || ''; }
            catch(e) { return ''; }
        }

        function saveChatSettings(){
            try {
                localStorage.setItem(CHAT_SETTINGS_KEY, JSON.stringify({
                    mode,
                    provider,
                    activeChatModel,
                    activeImageProvider,
                    activeImageModel,
                    chatProviderModels,
                    chatRatio,
                    chatResolution,
                    modelPickerScope
                }));
            } catch(e) {}
        }

        function uniqueModels(list){
            const seen = new Set();
            return (list || []).map(item => String(item || '').trim()).filter(item => item && !seen.has(item) && seen.add(item));
        }
        function chatProviders(){
            const list = (apiProviders || []).filter(p => p.enabled !== false && p.has_key && (p.chat_models || []).length);
            return list.length ? list : [{id:'comfly', name:'API', chat_models:[config.chat_model || 'gpt-4o-mini'], image_models:[config.image_model || 'gpt-image-2']}];
        }
        function imageProviders(){
            const list = (apiProviders || []).filter(p => p.enabled !== false && p.has_key && (p.image_models || []).length);
            return list.length ? list : [{id:'comfly', name:'API', image_models:[config.image_model || 'gpt-image-2'], chat_models:[config.chat_model || 'gpt-4o-mini']}];
        }
        function providerById(id, kind='chat'){
            const list = kind === 'image' ? imageProviders() : chatProviders();
            return list.find(p => p.id === id) || list[0];
        }
        function activePickerKind(){
            return 'chat';
        }
        function currentProviderId(kind=activePickerKind()){
            return kind === 'image' ? activeImageProvider : provider;
        }
        function modelListForCurrent(kind=activePickerKind()){
            const item = providerById(currentProviderId(kind), kind);
            return uniqueModels(kind === 'image' ? item.image_models : item.chat_models);
        }
        function currentModel(kind=activePickerKind()){
            return kind === 'image' ? activeImageModel : activeChatModel;
        }
        function providerNameById(id, kind=activePickerKind()){
            const item = providerById(id, kind);
            return item?.name || item?.id || 'API';
        }
        function shortModelName(value){
            return String(value || '').split('/').pop().split(':')[0] || 'Model';
        }
        function renderProviderControls(){
            const kind = activePickerKind();
            const providers = kind === 'image' ? imageProviders() : chatProviders();
            const pid = currentProviderId(kind);
            if(!providers.some(p => p.id === pid)) {
                if(kind === 'image') activeImageProvider = providers[0]?.id || 'comfly';
                else provider = providers[0]?.id || 'comfly';
            }
            const models = modelListForCurrent(kind);
            if(kind === 'image' && !models.includes(activeImageModel)) activeImageModel = models[0] || config.image_model;
            if(kind !== 'image' && !models.includes(activeChatModel)) activeChatModel = chatProviderModels[provider] && models.includes(chatProviderModels[provider]) ? chatProviderModels[provider] : (models[0] || config.chat_model);
            renderModelPicker();
        }

        function validateSavedProviderState(){
            const chatProviderList = chatProviders();
            provider = chatProviderList.some(p => p.id === provider) ? provider : (chatProviderList[0]?.id || 'comfly');
            const chatModels = uniqueModels(providerById(provider, 'chat')?.chat_models || []);
            const rememberedChatModel = chatProviderModels[provider];
            activeChatModel = chatModels.includes(activeChatModel)
                ? activeChatModel
                : (chatModels.includes(rememberedChatModel) ? rememberedChatModel : (chatModels[0] || config.chat_model));
            chatProviderModels[provider] = activeChatModel;

            const imageProviderList = imageProviders();
            activeImageProvider = imageProviderList.some(p => p.id === activeImageProvider) ? activeImageProvider : (imageProviderList[0]?.id || 'comfly');
            const imageModels = uniqueModels(providerById(activeImageProvider, 'image')?.image_models || []);
            activeImageModel = imageModels.includes(activeImageModel) ? activeImageModel : (imageModels[0] || config.image_model);
            if(mode !== 'agent' && mode !== 'chat' && mode !== 'image') mode = 'chat';
            if(mode === 'chat') modelPickerScope = 'chat';
            if(mode === 'image') modelPickerScope = 'image';
        }

        async function loadConfig(){
            try {
                const data = await fetch('/api/config').then(r=>r.json());
                config = { ...config, ...data };
                apiProviders = Array.isArray(config.api_providers) ? config.api_providers : [];
                config.chat_model = (config.chat_models || []).find(m => m === 'gpt-5.5') || config.chat_model || 'gpt-5.5';
                config.image_model = config.image_model || ((config.image_models || [])[0]) || 'gpt-image-2';
                validateSavedProviderState();
                setMode(mode, false);
                updateModelLabel();
                saveChatSettings();
            } catch(e) {}
        }
        window.StudioFrameMessages.subscribeApi(async e => {
            if(e.data?.type === 'providers-changed'){
                await loadConfig();
                renderProviderControls();
                updateModelLabel();
            }
        });

        function setProvider(p, kind=activePickerKind()) {
            if(kind === 'image') activeImageProvider = p;
            else provider = p;
            const models = modelListForCurrent(kind);
            if(kind === 'image') activeImageModel = models[0] || activeImageModel;
            else {
                activeChatModel = chatProviderModels[provider] && models.includes(chatProviderModels[provider]) ? chatProviderModels[provider] : (models[0] || activeChatModel);
            }
            renderProviderControls();
            updateModelLabel();
            saveChatSettings();
        }
        function setActiveModel(model, kind=activePickerKind()){
            if(kind === 'image') activeImageModel = model;
            else {
                activeChatModel = model;
                chatProviderModels[provider] = model;
            }
            renderProviderControls();
            updateModelLabel();
            saveChatSettings();
        }

        function toggleModelPicker(force){
            const picker = document.getElementById('modelPicker');
            const pop = document.getElementById('modelPickerPopover');
            const shouldOpen = typeof force === 'boolean' ? force : !picker.classList.contains('open');
            picker.classList.toggle('open', shouldOpen);
            pop?.classList.toggle('open', shouldOpen);
            document.getElementById('modelPickerBtn')?.setAttribute('aria-expanded', String(shouldOpen));
            if(shouldOpen) {
                if(pop && pop.parentElement !== document.body) {
                    modelPickerHome = picker;
                    document.body.appendChild(pop);
                }
                if(mode === 'image') modelPickerScope = 'image';
                if(mode === 'chat') modelPickerScope = 'chat';
                renderModelPicker();
                positionModelPicker();
                lucide.createIcons();
            } else if(pop && modelPickerHome && pop.parentElement === document.body) {
                modelPickerHome.appendChild(pop);
            }
        }

        function positionModelPicker(){
            const btn = document.getElementById('modelPickerBtn');
            const pop = document.getElementById('modelPickerPopover');
            if(!btn || !pop?.classList.contains('open')) return;
            const rect = btn.getBoundingClientRect();
            const viewportW = window.innerWidth;
            const viewportH = window.innerHeight;
            // Fixed coordinates inherit the page's UI zoom. Measure in viewport pixels.
            const scale = pop.getBoundingClientRect().width / pop.offsetWidth || 1;
            const margin = 12, gap = 8;
            const above = Math.max(0, rect.top - gap - margin);
            const below = Math.max(0, viewportH - rect.bottom - gap - margin);
            const placeAbove = above >= Math.min(260 * scale, below);
            const width = Math.min(380 * scale, viewportW - margin * 2);
            pop.style.setProperty('--model-picker-width', `${width / scale}px`);
            pop.style.setProperty('--model-picker-max-height', `${Math.min(390 * scale, placeAbove ? above : below) / scale}px`);
            const height = pop.getBoundingClientRect().height;
            const left = Math.max(margin, Math.min(rect.left, viewportW - width - margin));
            const top = placeAbove ? rect.top - gap - height : rect.bottom + gap;
            pop.style.setProperty('--model-picker-left', `${left / scale}px`);
            pop.style.setProperty('--model-picker-top', `${Math.max(margin, top) / scale}px`);
        }

        function setModelPickerScope(kind){
            modelPickerScope = kind === 'image' ? 'image' : 'chat';
            renderProviderControls();
            updateModelLabel();
            saveChatSettings();
        }

        function renderModelPicker(){
            const kind = activePickerKind();
            const picker = document.getElementById('modelPicker');
            const scope = document.getElementById('modelPickerScope');
            const providerList = document.getElementById('modelProviderList');
            const modelList = document.getElementById('modelList');
            const providerLabel = document.getElementById('modelPickerProvider');
            const modelLabel = document.getElementById('modelPickerModel');
            const title = document.getElementById('modelPickerTitle');
            if(!picker || !scope || !providerList || !modelList) return;
            const currentPid = currentProviderId(kind);
            const currentMdl = currentModel(kind);
            providerLabel.textContent = providerNameById(currentPid, kind);
            if(mode === 'agent') {
                modelLabel.textContent = `${shortModelName(activeChatModel)} + ${shortModelName(activeImageModel)}`;
            } else {
                modelLabel.textContent = shortModelName(currentMdl);
            }
            title.textContent = mode === 'agent' ? 'Agent 模型' : (kind === 'image' ? '生图模型' : '对话模型');
            scope.innerHTML = mode === 'agent'
                ? `<button class="${kind === 'chat' ? 'active' : ''}" onclick="setModelPickerScope('chat')">对话</button><button class="${kind === 'image' ? 'active' : ''}" onclick="setModelPickerScope('image')">图像</button>`
                : '';
            scope.style.display = mode === 'agent' ? 'flex' : 'none';
            const providers = kind === 'image' ? imageProviders() : chatProviders();
            providerList.innerHTML = providers.length
                ? providers.map(p => `<button class="model-picker-option ${p.id === currentPid ? 'active' : ''}" onclick="setProvider('${escapeHtml(p.id)}','${kind}')"><span>${escapeHtml(p.name || p.id)}</span>${p.id === currentPid ? '<i data-lucide="check"></i>' : ''}</button>`).join('')
                : `<div class="model-picker-empty">暂无平台</div>`;
            const models = modelListForCurrent(kind);
            modelList.innerHTML = models.length
                ? models.map(m => `<button class="model-picker-option ${m === currentMdl ? 'active' : ''}" onclick="setActiveModel('${escapeHtml(m)}','${kind}');toggleModelPicker(false)"><span>${escapeHtml(shortModelName(m))}</span>${m === currentMdl ? '<i data-lucide="check"></i>' : ''}</button>`).join('')
                : `<div class="model-picker-empty">暂无模型</div>`;
            lucide.createIcons();
        }

        let conversationNextOffset = null;
        let conversationsLoading = false;
        async function loadConversations(append = false){
            if (conversationsLoading) return;
            conversationsLoading = true;
            try {
                const offset = append ? conversationNextOffset : 0;
                if (append && offset === null) return;
                const response = await fetch('/api/conversations?limit=100&offset=' + offset, {headers:{'X-User-ID':userId}});
                if (!response.ok) throw new Error('对话列表加载失败');
                const data = await response.json();
                conversations = append ? [...conversations, ...(data.conversations || [])] : (data.conversations || []);
                conversations = Array.from(new Map(conversations.map(item => [item.id, item])).values());
                conversationNextOffset = data.next_offset ?? null;
                renderThreads();
                if(!currentConversation) {
                    const rememberedId = rememberedConversation();
                    if (rememberedId) {
                        try { await openConversation(rememberedId); } catch (error) { console.error(error); }
                    }
                    if (!currentConversation && conversations[0]) await openConversation(conversations[0].id);
                }
                if(!currentConversation) renderMessages([]);
            } finally { conversationsLoading = false; }
        }

        function renderThreads(){
            const list = document.getElementById('threadList');
            list.innerHTML = '';
            if(!conversations.length){
                list.innerHTML = `<div class="px-3 py-8 text-center text-[11px] font-bold text-gray-300 uppercase tracking-widest">${tr('chat.noHistory')}</div>`;
                return;
            }
            conversations.forEach(item => {
                const row = document.createElement('div');
                row.className = 'thread-row';
                const btn = document.createElement('button');
                btn.className = `thread-item ${currentConversation?.id === item.id ? 'active' : ''}`;
                btn.onclick = () => openConversation(item.id, true);
                btn.innerHTML = `<div class="text-sm font-bold truncate">${escapeHtml(item.title || defaultTitle())}</div><div class="text-[11px] opacity-50 truncate mt-1">${escapeHtml(item.last_message || '')}</div>`;
                const del = document.createElement('button');
                del.className = 'thread-delete';
                del.title = tr('chat.deleteTitle');
                del.setAttribute('aria-label', tr('chat.deleteTitle'));
                del.onclick = (event) => deleteConversation(item.id, event);
                del.innerHTML = '<i data-lucide="x" class="w-3.5 h-3.5"></i>';
                row.appendChild(btn);
                row.appendChild(del);
                list.appendChild(row);
            });
            if (conversationNextOffset !== null) {
                const more = document.createElement('button');
                more.className = 'thread-item';
                more.textContent = '加载更多';
                more.onclick = async () => {
                    more.disabled = true;
                    try { await loadConversations(true); }
                    catch (error) { console.error(error); more.textContent = '加载失败，点击重试'; }
                    finally { more.disabled = false; }
                };
                list.appendChild(more);
            }
            lucide.createIcons();
        }

        async function newConversation(){
            const data = await fetch('/api/conversations', {method:'POST', headers:headers(), body:JSON.stringify({title:'新对话'})}).then(r=>r.json());
            currentConversation = data.conversation;
            rememberConversation(currentConversation.id);
            setChatTitle(currentConversation.title);
            await loadConversations();
            renderMessages([]);
            toggleHistory(false);
        }

        async function openConversation(id, closePanel=false){
            const data = await fetch(`/api/conversations/${id}`, {headers:{'X-User-ID':userId}}).then(r=>r.json());
            currentConversation = data.conversation;
            rememberConversation(currentConversation.id);
            setChatTitle(currentConversation.title);
            renderThreads();
            renderMessages(currentConversation.messages || []);
            if(closePanel) toggleHistory(false);
        }

        async function deleteConversation(id, event){
            event.stopPropagation();
            if(document.getElementById('chatDeleteDialog')) return;
            const dialog = document.createElement('dialog');
            dialog.id = 'chatDeleteDialog';
            dialog.className = 'chat-delete-dialog';
            dialog.setAttribute('aria-labelledby','chatDeleteTitle');
            dialog.setAttribute('aria-describedby','chatDeleteDescription');
            dialog.innerHTML = '<h2 id="chatDeleteTitle">删除对话？</h2><p id="chatDeleteDescription"></p><p class="delete-error" role="alert" hidden></p><footer><button type="button" data-cancel autofocus>取消</button><button type="button" data-delete>删除对话</button></footer>';
            const item = conversations.find(item => item.id === id);
            dialog.querySelector('#chatDeleteDescription').textContent = '“' + (item?.title || defaultTitle()) + '”及其中的消息将被删除，此操作无法撤销。';
            const cancel = dialog.querySelector('[data-cancel]');
            const remove = dialog.querySelector('[data-delete]');
            let busy = false;
            cancel.onclick = () => dialog.close();
            dialog.addEventListener('cancel', e => { if(busy) e.preventDefault(); });
            dialog.addEventListener('close', () => dialog.remove(), {once:true});
            remove.onclick = async () => {
                if(busy) return;
                busy = true;
                cancel.disabled = remove.disabled = true;
                remove.textContent = '正在删除…';
                const error = dialog.querySelector('.delete-error');
                error.hidden = true;
                try {
                    const response = await fetch('/api/conversations/' + encodeURIComponent(id), {method:'DELETE', headers:{'X-User-ID':userId}});
                    if(!response.ok) throw new Error('删除失败，请稍后重试。');
                } catch(e) {
                    error.textContent = e.message || '删除失败，请稍后重试。';
                    error.hidden = false;
                    busy = false;
                    cancel.disabled = remove.disabled = false;
                    remove.textContent = '重试删除';
                    return;
                }
                dialog.close();
                const deletedCurrent = currentConversation?.id === id;
                if(deletedCurrent){ currentConversation = null; rememberConversation(''); setChatTitle(''); renderMessages([]); }
                conversations = conversations.filter(item => item.id !== id);
                renderThreads();
                try {
                    await loadConversations();
                    if(deletedCurrent && conversations[0]) await openConversation(conversations[0].id);
                } catch(e) { console.error('刷新历史对话失败', e); }
            };
            document.body.append(dialog);
            dialog.showModal();
        }

        function toggleHistory(force){
            const pop = document.getElementById('historyPopover');
            const shouldOpen = typeof force === 'boolean' ? force : !pop.classList.contains('open');
            pop.classList.toggle('open', shouldOpen);
            if(shouldOpen) lucide.createIcons();
        }

        document.addEventListener('click', (event) => {
            const picker = document.getElementById('modelPicker');
            const popover = document.getElementById('modelPickerPopover');
            if(picker?.classList.contains('open') && !picker.contains(event.target) && !popover?.contains(event.target)) toggleModelPicker(false);
            if(window.innerWidth > 900) return;
            const rail = document.getElementById('historyPopover');
            const actions = document.querySelector('.top-actions');
            if(rail?.classList.contains('open') && !rail.contains(event.target) && actions && !actions.contains(event.target)) toggleHistory(false);
        });

        function setMode(next, persist = true){
            mode = next;
            if(next === 'chat') modelPickerScope = 'chat';
            if(next === 'image') modelPickerScope = 'image';
            toggleModelPicker(false);
            document.getElementById('chatModeBtn')?.classList.toggle('active', next === 'chat');
            document.getElementById('agentModeBtn')?.classList.toggle('active', next === 'agent');
            document.getElementById('imageModeBtn')?.classList.toggle('active', next === 'image');
            document.getElementById('imageControls')?.classList.toggle('hidden', true);
            renderProviderControls();
            updateModelLabel();
            if(persist) saveChatSettings();
        }

        function updateModelLabel(){
            let label = '';
            if (mode === 'image') {
                label = activeImageModel || config.image_model || 'Image';
            } else if (mode === 'agent') {
                const chatLabel = activeChatModel || config.chat_model || 'Chat';
                const imageLabel = (activeImageModel || config.image_model || 'Image').split('/').pop().split(':')[0];
                label = `Agent · ${chatLabel} + ${imageLabel}`;
            } else {
                label = activeChatModel || config.chat_model || 'Chat';
            }
            const labelEl = document.getElementById('modelLabel');
            if(labelEl) labelEl.textContent = label;
        }

        function setChatRatio(next, preferredSize = ''){
            chatRatio = next;
            ['square','portrait','portrait43','landscape43','landscape','story','wide'].forEach(item => {
                document.getElementById(`chat-ratio-${item}`).classList.toggle('active', item === next);
            });
            if(preferredSize){ const match = SIZE_OPTIONS[next].find(([value]) => value === preferredSize); if(match) chatResolution = match[1]; }
            updateChatResolutionUI();
            saveChatSettings();
        }

        function setChatResolution(next){ chatResolution = next; updateChatResolutionUI(); saveChatSettings(); }
        function updateChatResolutionUI(){
            document.getElementById('chat-res-1k').classList.toggle('active', chatResolution === '1k');
            document.getElementById('chat-res-2k').classList.toggle('active', chatResolution === '2k');
        }

        function currentChatSize(){
            const options = SIZE_OPTIONS[chatRatio] || SIZE_OPTIONS.square;
            const match = options.find(([, label]) => label === chatResolution) || options[0];
            return match[0];
        }

        function chatSizeFromPrompt(message, fallbackSize = currentChatSize()){
            const text = String(message || '');
            const direct = text.match(/(^|[^\d])([1-9]\d{2,4})\s*[xX×*]\s*([1-9]\d{2,4})(?!\d)/);
            if(direct) {
                const w = Number(direct[2]);
                const h = Number(direct[3]);
                if(w >= 256 && h >= 256) return `${w}x${h}`;
            }
            const normalized = text.replace(/[：﹕∶]/g, ':').replace(/比/g, ':').replace(/[／/]/g, ':');
            const match = normalized.match(/(^|[^\d])(1|2|3|4|9|16)\s*:\s*(1|2|3|4|9|16)(?!\d)/);
            if(!match) return fallbackSize;
            const ratio = `${Number(match[2])}:${Number(match[3])}`;
            const ratioMap = { '1:1':'square', '2:3':'portrait', '3:2':'landscape', '3:4':'portrait43', '4:3':'landscape43', '9:16':'story', '16:9':'wide' };
            const key = ratioMap[ratio];
            if(!key) return fallbackSize;
            const wants2k = /2\s*k|2K|高清|高分辨率/i.test(text);
            const fallbackEdge = Math.max(...String(fallbackSize || '').split(/[xX×*]/).map(n => Number(n) || 0));
            const targetLabel = wants2k || fallbackEdge >= 1500 ? '2k' : '1k';
            return (SIZE_OPTIONS[key] || SIZE_OPTIONS.square).find(([, label]) => label === targetLabel)?.[0] || fallbackSize;
        }

        function renderMessages(messages){
            const box = document.getElementById('messages');
            box.innerHTML = '';
            if(!messages.length){
                box.innerHTML = `<div class="empty-state"><i data-lucide="messages-square"></i><div class="empty-state-text">${tr('chat.ready')}</div></div>`;
                lucide.createIcons();
                return;
            }
            messages.forEach(addMessageBubble);
            scrollBottom();
        }

        function addMessageBubble(msg){
            const box = document.getElementById('messages');
            const row = document.createElement('div');
            row.className = `bubble-row ${msg.role === 'user' ? 'user' : 'assistant'}`;
            const bubble = document.createElement('div');
            bubble.className = `bubble ${msg.role === 'user' ? 'user' : 'assistant'}`;
            const imageUrls = Array.isArray(msg.image_urls) && msg.image_urls.length ? msg.image_urls : (msg.image_url ? [msg.image_url] : []);
            if(imageUrls.length) bubble.classList.add('image-bubble');
            const text = document.createElement('div');
            text.textContent = msg.type === 'image' ? (msg.agent_reply || tr('chat.generated')) : (msg.content || '');
            text.className = 'bubble-text';
            bubble.appendChild(text);
            if(msg.attachments?.length){
                const thumbs = document.createElement('div');
                thumbs.className = 'thumbs';
                msg.attachments.forEach(ref => {
                    const thumb = renderAttachmentThumb(ref);
                    thumbs.appendChild(thumb);
                });
                bubble.appendChild(thumbs);
            }
            if(imageUrls.length){
                const grid = document.createElement('div');
                grid.className = `generated-grid count-${Math.min(imageUrls.length, 4)}`;
                imageUrls.forEach(url => {
                    const img = document.createElement('img');
                    img.className = 'generated';
                    img.src = url;
                    img.onclick = () => openImagePreview(url);
                    grid.appendChild(img);
                });
                bubble.appendChild(grid);
            }
            // Show model badge for assistant messages
            if(msg.role === 'assistant' && msg.model){
                const badge = document.createElement('div');
                const modelShort = msg.model.split('/').pop().split(':')[0];
                const isMs = msg.model.includes('/') && !msg.model.includes('gpt');
                badge.style.cssText = `margin-top:8px;font-size:9px;font-weight:700;opacity:.45;letter-spacing:.06em;`;
                badge.textContent = modelShort;
                bubble.appendChild(badge);
            }
            row.appendChild(bubble);
            box.appendChild(row);
            lucide.createIcons();
            return {row, bubble, text};
        }

        function openImagePreview(url){
            const modal = document.getElementById('imagePreviewModal');
            const img = document.getElementById('imagePreviewImg');
            if(!modal || !img || !url) return;
            img.src = url;
            modal.classList.add('open');
            lucide.createIcons();
        }

        function closeImagePreview(){
            const modal = document.getElementById('imagePreviewModal');
            const img = document.getElementById('imagePreviewImg');
            modal?.classList.remove('open');
            if(img) img.src = '';
        }

        function isImageRef(ref){
            const kind = String(ref?.kind || '').toLowerCase();
            const mime = String(ref?.mime || '').toLowerCase();
            const url = String(ref?.url || '').toLowerCase();
            return kind === 'image' || mime.startsWith('image/') || /\.(png|jpe?g|webp|gif|bmp|tiff?)(\?|#|$)/.test(url);
        }

        function attachmentName(ref){
            return ref?.name || (ref?.url || '').split('/').pop() || '附件';
        }

        function renderAttachmentThumb(ref){
            if(isImageRef(ref)){
                const img = document.createElement('img');
                img.className = 'thumb';
                img.src = ref.url;
                img.title = attachmentName(ref);
                img.onclick = () => openImagePreview(ref.url);
                return img;
            }
            const node = document.createElement('div');
            node.className = 'thumb file-thumb';
            node.title = attachmentName(ref);
            node.innerHTML = `<i data-lucide="file"></i><span class="thumb-name">${escapeHtml(attachmentName(ref))}</span>`;
            return node;
        }

        function renderRefChip(ref, i){
            if(isImageRef(ref)){
                return `<div class="ref-chip"><img src="${escapeHtml(ref.url)}" title="${escapeHtml(attachmentName(ref))}"><button onclick="removeRef(${i})">×</button></div>`;
            }
            return `<div class="ref-chip file"><i data-lucide="file"></i><span class="ref-file-name" title="${escapeHtml(attachmentName(ref))}">${escapeHtml(attachmentName(ref))}</span><button onclick="removeRef(${i})">×</button></div>`;
        }

        async function uploadFiles(files){
            if(!files?.length) return;
            const available = Math.max(0, 4 - refs.length);
            if(!available) return;
            const form = new FormData();
            [...files].slice(0, available).forEach(file => form.append('files', file));
            try {
                const data = await fetch('/api/ai/upload', {method:'POST', body:form}).then(async r => { if(!r.ok) throw new Error(chatErrorMessage((await r.json().catch(() => ({}))).detail, r.status)); return r.json(); });
                refs.push(...(data.files || []));
                renderRefs();
            } catch(e) {
                alert(e.message || '上传失败');
            }
        }

        function renderRefs(){
            const strip = document.getElementById('refStrip');
            strip.innerHTML = refs.map((ref,i) => renderRefChip(ref, i)).join('');
            lucide.createIcons();
            updateComposerOverflow();
        }

        function removeRef(i){ refs.splice(i,1); renderRefs(); }

        window.addEventListener('paste', e => {
            const files = [...(e.clipboardData?.items || [])].filter(x => x.kind === 'file').map(x => x.getAsFile()).filter(Boolean);
            if(files.length) uploadFiles(files);
        });

        const composerBody = document.getElementById('composerBody');
        composerBody.addEventListener('dragover', e => {
            if(!hasUploadFiles(e.dataTransfer?.items)) return;
            e.preventDefault();
            composerBody.classList.add('drag-over');
        });
        composerBody.addEventListener('dragleave', e => {
            if(!composerBody.contains(e.relatedTarget)) composerBody.classList.remove('drag-over');
        });
        composerBody.addEventListener('drop', e => {
            if(!hasUploadFiles(e.dataTransfer?.items)) return;
            e.preventDefault();
            composerBody.classList.remove('drag-over');
            const files = [...(e.dataTransfer?.files || [])];
            uploadFiles(files);
        });

        function hasUploadFiles(items){ return [...(items || [])].some(item => item.kind === 'file'); }
        function updateComposerOverflow(){
            const body = document.getElementById('composerBody');
            if(!body) return;
            body.classList.toggle('has-overflow', body.scrollHeight > body.clientHeight + 2);
        }
        function autoGrow(el){ el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 150) + 'px'; updateComposerOverflow(); }
        function handleKey(e){ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } }
        window.addEventListener('keydown', e => {
            if(e.key === 'Escape') closeImagePreview();
        });

        async function sendMessage(){
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if(!message) return;
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            const requestedSize = chatSizeFromPrompt(message);
            const pendingRefs = refs.slice();
            refs = [];
            renderRefs();
            input.value = '';
            autoGrow(input);
            if(!currentConversation){
                currentConversation = {id:'', title:'新对话', messages:[]};
                document.getElementById('messages').innerHTML = '';
            }
            addMessageBubble({role:'user', content:message, attachments:pendingRefs});
            const assistantBubble = addMessageBubble({role:'assistant', content: ''});
            assistantBubble.bubble.classList.add('streaming');
            scrollBottom();
            try {
                await streamChatMessage(message, pendingRefs, assistantBubble);
            } catch(err) {
                renderMessages([...(currentConversation.messages || []), {role:'assistant', content:err.message || tr('chat.requestFailed')}]);
            } finally {
                btn.disabled = false;
                scrollBottom();
            }
        }

        function chatErrorMessage(detail, status){
            if(typeof detail === 'string' && detail.trim()) return detail;
            if(detail && typeof detail.message === 'string' && detail.message.trim()) return detail.message;
            const messages = {
                authentication_required:'登录已过期，请重新登录。',
                workspace_required:'请先选择工作空间。',
                workspace_forbidden:'无权访问当前空间，请检查空间授权。',
                permission_denied:'没有发送对话的权限，请联系管理员。',
                provider_not_assigned:'当前空间未分配该供应商，或供应商已停用。',
                model_not_available:'该模型未开放或已停用，请重新选择模型。',
                maintenance_restricted:'当前空间正在维护，请稍后再试。',
                route_not_migrated:'聊天接口暂不可用，请联系管理员更新服务。'
            };
            const message = messages[detail?.code];
            return typeof message === 'string' ? message : (status === 403 ? '没有发送对话的权限，请联系管理员。' : tr('chat.requestFailed'));
        }

        async function streamChatMessage(message, pendingRefs, assistantBubble){
            // 固定本次请求使用的配置；后续切换模型不影响已经发出的请求。
            const currentProvider = provider;
            const currentChatModel = activeChatModel || config.chat_model;

            const response = await fetch('/api/chat/stream', {
                method:'POST',
                headers:headers(),
                body:JSON.stringify({
                    conversation_id: currentConversation.id || '',
                    message,
                    mode:'chat',
                    model: currentChatModel,
                    provider: currentProvider,
                    reference_images: pendingRefs
                })
            });
            if(!response.ok){
                throw new Error(chatErrorMessage((await response.json().catch(() => ({}))).detail, response.status));
            }
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let pendingEventText = '';
            let assistantText = '';
            while(true){
                const {value, done} = await reader.read();
                if(done) break;

                // 网络分块可能截断事件，保留最后一段，等下次读取后再解析。
                pendingEventText += decoder.decode(value, {stream:true});
                const events = pendingEventText.split('\n\n');
                pendingEventText = events.pop() || '';
                for(const eventText of events){
                    const dataLine = eventText.split('\n').find(item => item.startsWith('data:'));
                    if(!dataLine) continue;
                    const event = JSON.parse(dataLine.slice(5).trim());

                    if(event.type === 'meta'){
                        currentConversation = event.conversation;
                        rememberConversation(currentConversation.id);
                        setChatTitle(currentConversation.title);
                    }
                    if(event.type === 'delta'){
                        assistantText += event.delta || '';
                        assistantBubble.text.textContent = assistantText;
                        scrollBottom();
                    }
                    if(event.type === 'error'){
                        throw new Error(chatErrorMessage(event.detail));
                    }
                    if(event.type === 'done'){
                        // 完成后以服务端会话替换流式预览，并更新会话列表。
                        assistantBubble.bubble.classList.remove('streaming');
                        currentConversation = event.conversation;
                        rememberConversation(currentConversation.id);
                        setChatTitle(currentConversation.title);
                        renderMessages(currentConversation.messages || []);
                        await loadConversations();
                    }
                }
            }
            assistantBubble.bubble.classList.remove('streaming');
        }

        function scrollBottom(){ requestAnimationFrame(() => { const box = document.getElementById('messages'); box.scrollTop = box.scrollHeight; }); }
        function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }

        window.onload = async () => {
            applyLanguage();
            setChatRatio(chatRatio);
            setChatResolution(chatResolution);
            await loadConfig();
            await loadConversations();
            updateComposerOverflow();
        };
    </script>
</body>
