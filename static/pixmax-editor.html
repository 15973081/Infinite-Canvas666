  <style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#111113;color:#adb3c0}#app>.stage-editor,#app>.video-editor{width:100%;height:100%}.local-editor-error{padding:32px;font:14px system-ui}.local-media-picker{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:#0009;padding:24px}.local-media-picker>section{width:min(1100px,100%);height:min(720px,100%);display:flex;flex-direction:column;border:1px solid #313136;border-radius:12px;background:#141416;overflow:hidden}.local-media-picker header{display:flex;align-items:center;justify-content:space-between;height:64px;padding:16px 24px;flex-shrink:0}.local-media-picker h2{font-size:18px;color:#fafafa}.local-picker-close{width:32px;height:32px;border-radius:8px;font-size:24px}.local-picker-close:hover{background:#252529}.local-media-picker nav{padding:0 24px 16px;border-bottom:1px solid #313136;color:#fafafa;font-size:14px}.local-picker-content{display:flex;flex-direction:column;min-height:0;flex:1;padding:20px 24px}.local-picker-content>.media-picker-content{min-height:0;height:100%}.local-picker-content .media-picker__grid{flex:1;overflow:auto}</style>
