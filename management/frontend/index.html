<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadox · 管理平台</title><link rel="stylesheet" href="/static/management.css"><script src="/static/provider-prices.js" defer></script><script src="/static/provider-editor.js" defer></script><link id="billing-view-style" rel="stylesheet" href="/static/billing-view.css"><script src="/static/billing-view.js" defer></script><script src="/static/model-billing.js" defer></script><script src="/static/image-tools.js" defer></script><script src="/static/management.js" defer></script></head>
<body>
<section id="login" class="login" hidden><form id="login-form" class="card">
<p class="eyebrow">SHADOX / ADMIN</p><h1>管理平台</h1><p class="muted">使用获授权的成员账号登录。</p>
<label>账号<input name="username" autocomplete="username" required maxlength="64"></label>
<label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
<label class="check"><input name="remember" type="checkbox"> 保持登录</label><button type="submit" class="primary">登录管理平台</button>
</form></section>
<section id="unavailable" class="login" hidden><div class="card"><h1>暂时无法访问管理平台</h1><p id="unavailable-reason"></p><div class="actions"><button id="retry">重新检查</button><button id="unavailable-logout">退出登录</button></div></div></section>
<div id="shell" class="shell" hidden>
<aside id="admin-navigation"><div class="brand">shadox <span>管理平台 / ADMIN</span></div><button id="close-navigation" class="mobile-only" aria-label="关闭导航">关闭 ×</button><nav aria-label="管理导航">
<button data-view="overview">概览</button>
<details class="nav-group" open><summary>组织与协作</summary><button data-view="members">成员与分配</button><button data-view="spaces">空间</button><button data-view="roles">角色与权限</button></details>
<details class="nav-group" open><summary>模型与资源</summary><button data-view="providers">供应商与分配</button><button data-view="imageTools">图片工具</button><button data-view="modelBilling">模型与计费</button></details>
<details class="nav-group" open><summary>运营与费用</summary><button data-view="billing">账号费用</button><button data-view="occupancy">画布占用</button><button data-view="tasks">任务处置</button></details>
<details class="nav-group" open><summary>系统与维护</summary><button data-view="backups">备份记录</button><button data-view="databases">数据库连接</button><button data-view="maintenance">维护中心</button><button data-view="audit">操作审计</button></details>
</nav><div class="aside-bottom"><span id="identity"></span><button id="logout">退出登录</button></div></aside>
<button id="navigation-backdrop" class="navigation-backdrop" aria-label="关闭导航" hidden tabindex="-1"></button>
<main><header><div class="page-heading"><button id="open-navigation" class="mobile-only" aria-label="打开导航" aria-controls="admin-navigation" aria-expanded="false">☰</button><div><p class="eyebrow" id="section-label">工作空间 / OVERVIEW</p><h1 id="title">概览</h1></div></div><label class="scope">管理范围<select id="scope" aria-label="管理范围"></select></label></header>
<div id="content" aria-live="polite"></div></main>
</div>
<div id="message" role="status" hidden></div>
<dialog id="dialog"><form id="dialog-form"><div id="dialog-body"></div><div class="actions"><button type="button" id="cancel-dialog">取消</button><button class="primary" id="confirm-dialog" type="submit">确认保存</button></div></form></dialog>
</body></html>
